<div class="login-container">
  <div class="login-card">
    <div class="logo-container">
      <img src="logo.png" alt="Logo" class="logo-image" />
    </div>

    <h1 class="title">Bem-vindo</h1>
    <p class="subtitle">Entre na sua conta para continuar</p>

    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email" class="form-label">E-mail</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="2"/>
          </svg>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="seu@email.com"
            class="form-input"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Senha</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M12 15V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 11V7C7 4.23858 9.23858 2 12 2C14.7614 2 17 4.23858 17 7V11" stroke="currentColor" stroke-width="2"/>
          </svg>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••"
            class="form-input"
            required
          />
          <button 
            type="button" 
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 5C5 5 2 12 2 12C2 12 5 19 12 19C19 19 22 12 22 12C22 12 19 5 12 5Z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input 
            type="checkbox" 
            [(ngModel)]="rememberMe" 
            name="rememberMe"
            class="checkbox-input"
          />
          <span class="checkbox-text">Lembrar-me</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">
        Entrar
      </button>
    </form>
  </div>

  <div class="copyright">
    © 2026 <a href="https://lognetbr.com.br/" target="_blank" rel="noopener noreferrer" class="sidebar__link">
          BRLognet
        </a>. Todos os direitos reservados.
  </div>
</div>
