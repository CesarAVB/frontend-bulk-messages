
<section class="confirmar-envio-page">
  <header class="confirmar-header">
    <h1>Confirmar Envio</h1>
    <p>Revise os detalhes antes de prosseguir</p>
  </header>

  <div class="confirm-card">
    <div class="info-row">
      <div class="info-box info-box--modelo">
        <div class="info-icon info-icon--modelo">
          <i class="material-icons">schedule</i>
        </div>
        <div class="info-content">
          <div class="info-label">Modelo selecionado</div>
          <div class="info-value">{{ modeloSelecionado?.titulo || modeloSelecionado?.nome || 'N/A' }}</div>
        </div>
      </div>
      <div class="info-box info-box--contatos">
        <div class="info-icon info-icon--contatos">
          <i class="material-icons">groups</i>
        </div>
        <div class="info-content">
          <div class="info-label">Contatos a receber</div>
          <div class="info-value">{{ contatos.length }}</div>
        </div>
      </div>
    </div>

    <div class="preview-section">
      <div class="preview-label">Prévia da mensagem</div>
      <div class="preview-box">{{ modeloSelecionado?.conteudo || 'Nenhum modelo selecionado.' }}</div>
    </div>

    <div class="confirm-actions">
      <button type="button" class="btn-outline" (click)="voltar()" [disabled]="enviando">Voltar</button>
      <button type="button" class="btn-primary" (click)="confirmar()" [disabled]="enviando">
        <i class="material-icons">{{ enviando ? 'hourglass_empty' : 'send' }}</i> 
        {{ enviando ? 'Enviando...' : 'Confirmar Envio' }}
      </button>
    </div>
  </div>
</section>
