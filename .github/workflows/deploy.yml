name: Deploy Angular App to Nginx Message

# Gatilho: roda quando houver push na branch main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # Ambiente do GitHub Actions (Ubuntu)

    steps:
      # 1️⃣ Baixar o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js usando o .nvmrc (22.12.0)
      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'  # lê a versão do Node definida no projeto

      # 3️⃣ Instalar dependências do Angular
      - name: Install dependencies
        run: npm ci   # npm ci garante build reproduzível no CI (mais rápido e confiável que npm install)

      # 4️⃣ Criar environment.ts se não existir
      # Isso evita erro de build no CI quando environment.ts não está no repositório
      - name: Ensure environment.ts exists
        run: |
          if [ ! -f src/environments/environment.ts ]; then
            cp src/environments/environment.example.ts src/environments/environment.ts
          fi

      # 5️⃣ Build do Angular em modo produção
      # npx usa a versão local da CLI (não precisa instalar global)
      # Gera os arquivos otimizados na pasta dist/whatsapp-sender/browser/
      - name: Build Angular app
        run: npx ng build --configuration production

      # 6️⃣ Deploy para o servidor Nginx via rsync
      # rsync é mais eficiente que SCP para sincronizar arquivos
      - name: Deploy to Nginx message
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # Switches do rsync:
          # -a = modo arquivo (preserva permissões, timestamps, etc)
          # -v = verbose (mostra o que está sendo copiado)
          # -z = comprime dados durante transferência
          # -r = recursivo (copia subpastas)
          # --delete = remove arquivos antigos do servidor que não existem mais no source
          switches: -avzr --delete
          
          # IMPORTANTE: a barra / no final copia APENAS O CONTEÚDO da pasta browser
          # Sem a barra, copiaria a pasta "browser" inteira criando: message/browser/
          path: dist/whatsapp-sender/browser/
          
          # Pasta de destino no servidor (onde o Nginx serve os arquivos)
          remote_path: /var/www/html/projetos_web/message/
          
          # Dados de conexão SSH (armazenados nos Secrets do GitHub)
          remote_host: ${{ secrets.SERVER_HOST }}      # IP ou domínio do servidor
          remote_port: ${{ secrets.SERVER_PORT }}      # Porta SSH (normalmente 22)
          remote_user: ${{ secrets.SERVER_USER }}      # Usuário SSH
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}   # Chave privada SSH

      # 7️⃣ Mensagem de sucesso
      - name: Deployment complete
        run: echo "Angular whatsapp-sender deployed successfully to nginx_message"