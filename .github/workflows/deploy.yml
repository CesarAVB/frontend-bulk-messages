name: Deploy Angular App to Nginx Message

# Gatilho: roda quando houver push na branch principal
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # Ambiente Ubuntu no Actions

    steps:
      # 1️ - Baixar o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️ - Configurar Node.js usando o .nvmrc (22.12.0 no seu projeto)
      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'  # lê Node 22.12.0 do arquivo .nvmrc

      # 3️ - Instalar dependências do Angular
      - name: Install dependencies
        run: npm ci   # npm ci é mais rápido e reproduzível no CI

      # 4️ - Criar environment.ts se não existir (evita erro de build)
      - name: Ensure environment.ts exists
        run: |
          if [ ! -f src/environments/environment.ts ]; then
            cp src/environments/environment.example.ts src/environments/environment.ts
          fi

      # 5️ - Build do Angular
      - name: Build Angular app
        run: npx ng build --configuration production

      # 6️ - Deploy para o volume do Nginx (container nginx_message)
      - name: Deploy to Nginx message via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}                     # IP ou hostname do seu servidor
          username: ${{ secrets.SERVER_USER }}                 # Usuário SSH
          key: ${{ secrets.SSH_PRIVATE_KEY }}                  # Chave privada SSH
          port: ${{ secrets.SERVER_PORT }}                     # Porta SSH (22 normalmente)
          
          # Source: conteúdo da pasta browser do build Angular
          source: dist/whatsapp-sender/browser/*               # Tudo dentro de browser/
          
          # Target: volume do host onde o container Nginx lê os arquivos
          target: /var/www/html/projetos_web/message
          
          strip_components: 1                                  # Remove a pasta 'browser' do caminho

      # 7️ - Mensagem de sucesso
      - name: Deployment complete
        run: echo "✅ Angular whatsapp-sender deployed successfully to nginx_message"
