name: Deploy Angular App to Nginx Message

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️ - Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️ - Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # 3️ - Instalar dependências
      - name: Install dependencies
        run: npm ci

      # 4️ - Build Angular
      - name: Build Angular app
        run: npm run build

      # 5️ - Deploy via SCP
      - name: Deploy to Nginx message
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: dist/whatsapp-sender/browser/*      # Conteúdo do Angular
          target: /var/www/html/projetos_web/message  # volume do host
          strip_components: 1                         # remove a pasta dist do caminho
